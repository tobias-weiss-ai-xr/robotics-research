# ⚙️ Research Taxonomy & Discovery Config — Robotics Research
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Robotics Research"
  short: "robotics"
  description: "Robotics research corpus: manipulation, locomotion, perception, planning, learning, and human-robot interaction."
  openalex_mailto: "research@tobias-weiss-ai-xr.de"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis (robotics subfields).
# Subcategories = the secondary axis (research aspects).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:
    - id: manipulation
      display: "Manipulation & Grasping"
    - id: locomotion
      display: "Locomotion & Mobility"
    - id: perception
      display: "Perception & Sensing"
    - id: planning
      display: "Planning & Control"
    - id: learning
      display: "Learning & Adaptation"
    - id: human-robot
      display: "Human-Robot Interaction"
    - id: multi-robot
      display: "Multi-Robot Systems"
    - id: simulation
      display: "Simulation & World Models"
    - id: survey
      display: "Surveys & Taxonomies"
  subcategories:
    - id: theory
      display: "Theory"
    - id: mechanism
      display: "Mechanism"
    - id: method
      display: "Method"
    - id: application
      display: "Application"
    - id: development
      display: "Development"
    - id: systems
      display: "Systems & Technology"
    - id: evaluation
      display: "Evaluation & Benchmarks"
    - id: review
      display: "Reviews & Surveys"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
# Dict entries can carry optional category/subcategory_hint for auto-classification.
arxiv_queries:
  - query: 'cat:cs.RO AND (abs:"manipulation" OR abs:"grasping" OR abs:"dexterous")'
    category: manipulation
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"locomotion" OR abs:"legged" OR abs:"quadruped" OR abs:"bipedal")'
    category: locomotion
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"aerial" OR abs:"quadrotor" OR abs:"drone" OR abs:"UAV")'
    category: locomotion
    subcategory_hint: application
  - query: 'cat:cs.RO AND (abs:"motion planning" OR abs:"trajectory optimization" OR abs:"model predictive control")'
    category: planning
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"reinforcement learning" OR abs:"imitation learning" OR abs:"learning from demonstration")'
    category: learning
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"sim-to-real" OR abs:"sim2real" OR (abs:"domain adaptation" AND abs:"robot"))'
    category: simulation
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"human-robot interaction" OR abs:"human-robot collaboration" OR abs:"shared autonomy")'
    category: human-robot
    subcategory_hint: application
  - query: 'cat:cs.RO AND (abs:"multi-robot" OR abs:"swarm" OR (abs:"multi-agent" AND abs:"robot"))'
    category: multi-robot
    subcategory_hint: systems
  - query: 'cat:cs.RO AND (abs:"world model" OR (abs:"simulation" AND abs:"robot") OR abs:"differentiable simulation")'
    category: simulation
    subcategory_hint: systems
  - query: 'cat:cs.RO AND (abs:"visuomotor" OR abs:"tactile" OR abs:"proprioception" OR abs:"multimodal perception")'
    category: perception
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"vision-language-action" OR abs:"VLA" OR (abs:"foundation model" AND abs:"robot"))'
    category: manipulation
    subcategory_hint: method
  - query: 'cat:cs.RO AND (abs:"survey" OR abs:"review" OR abs:"taxonomy")'
    category: survey
    subcategory_hint: review
  - query: 'cat:cs.LG AND abs:"robot" AND (abs:"learning" OR abs:"control" OR abs:"manipulation")'
    category: learning
    subcategory_hint: method
  - query: 'cat:cs.AI AND abs:"robot" AND (abs:"planning" OR abs:"manipulation" OR abs:"navigation")'
    category: planning
    subcategory_hint: method

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
# Each entry defines one query against a source (dblp, crossref, europepmc, …).
other_sources_queries:
  - source: dblp
    query: robotic manipulation grasping
    category: manipulation
    subcategory_hint: method
  - source: dblp
    query: legged robot locomotion
    category: locomotion
    subcategory_hint: method
  - source: dblp
    query: robot motion planning
    category: planning
    subcategory_hint: method
  - source: dblp
    query: robot learning reinforcement imitation
    category: learning
    subcategory_hint: method
  - source: dblp
    query: human-robot interaction
    category: human-robot
    subcategory_hint: application
  - source: dblp
    query: multi-robot swarm coordination
    category: multi-robot
    subcategory_hint: systems
  - source: crossref
    query: robotic manipulation learning
    category: manipulation
    subcategory_hint: method
  - source: crossref
    query: quadrupedal locomotion reinforcement learning
    category: locomotion
    subcategory_hint: method
  - source: crossref
    query: robot perception multimodal sensing
    category: perception
    subcategory_hint: systems
  - source: crossref
    query: vision-language-action model robotics
    category: manipulation
    subcategory_hint: method
  - source: crossref
    query: sim-to-real transfer robotics
    category: simulation
    subcategory_hint: method
  - source: crossref
    query: human-robot interaction survey
    category: human-robot
    subcategory_hint: review
  - source: crossref
    query: multi-robot systems survey
    category: multi-robot
    subcategory_hint: review
  - source: crossref
    query: robotics survey review
    category: survey
    subcategory_hint: review
  - source: europepmc
    query: robot manipulation grasping learning
    category: manipulation
    subcategory_hint: method
  - source: europepmc
    query: robot locomotion reinforcement learning
    category: locomotion
    subcategory_hint: method

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
# Per-category OpenAlex search phrases.
openalex_queries:
  - category: manipulation
    query: "robotic manipulation grasping dexterous"
  - category: locomotion
    query: "robot locomotion legged quadruped bipedal"
  - category: perception
    query: "robot perception sensing multimodal tactile"
  - category: planning
    query: "robot motion planning trajectory optimization control"
  - category: learning
    query: "robot learning reinforcement imitation demonstration"
  - category: human-robot
    query: "human-robot interaction collaboration shared autonomy"
  - category: multi-robot
    query: "multi-robot swarm coordination cooperative"
  - category: simulation
    query: "robot simulation world model sim-to-real transfer"
  - category: survey
    query: "robotics survey review taxonomy"

