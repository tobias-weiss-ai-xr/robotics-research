# ── Subclassification keywords ───────────────────────────────────────────────
# Maps subcategory IDs to keyword lists for auto-classification.
# The first matching rule wins. Falls back to heuristic ordering.
subcategory_keywords:
  - id: theory
    keywords: ["theory", "theoretical", "formal", "proof", "convergence", "bound", "analysis of", "complexity"]
  - id: mechanism
    keywords: ["mechanism", "explainab", "interpretab", "attention", "saliency", "feature importance", "why does"]
  - id: method
    keywords: ["method", "algorithm", "approach", "technique", "framework", "novel method", "our method", "propose"]
  - id: application
    keywords: ["application", "applied", "deploy", "real-world", "case study", "use case", "experiment", "field"]
  - id: development
    keywords: ["implementation", "system", "platform", "toolkit", "library", "open-source", "software", "pipeline", "hardware", "SDK", "API"]
  - id: systems
    keywords: ["simulator", "simulation", "engine", "benchmark", "testbed", "environment", "infrastructure", "sensor", "actuator", "gym"]
  - id: evaluation
    keywords: ["benchmark", "evaluation", "comparison", "baseline", "state-of-the-art", "sota", "leaderboard", "metric", "ablation"]
  - id: review
    keywords: ["survey", "review", "literature", "systematic review", "meta-analysis", "overview", "taxonomy"]

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
github_queries:
  - query: "topic:robotics+stars:>100"
    category: manipulation
  - query: "robot+manipulation+framework+stars:>200"
    category: manipulation
    subcategory_hint: development
  - query: "robot+learning+reinforcement+stars:>100"
    category: learning
  - query: "robot+simulator+stars:>200"
    category: simulation
    subcategory_hint: systems
  - query: "motion+planning+robot+stars:>100"
    category: planning
  - query: "locomotion+robot+stars:>50"
    category: locomotion
  - query: "human-robot+interaction+stars:>50"
    category: human-robot
  - query: "multi-robot+swarm+stars:>50"
    category: multi-robot
  - query: "robot+perception+stars:>100"
    category: perception
  - query: "awesome+robotics+stars:>100"
    category: survey
    subcategory_hint: review

# ── GitLab repository discovery (fetch_gitlab_repos.py) ──────────────────────
gitlab_queries:
  - query: "robot manipulation"
    category: manipulation
  - query: "robot learning"
    category: learning
  - query: "robot simulator"
    category: simulation
    subcategory_hint: systems
  - query: "motion planning"
    category: planning

# ── Codeberg repository discovery (fetch_codeberg_repos.py) ──────────────────
codeberg_queries:
  - query: "robot"
    category: manipulation
  - query: "robotics"
    category: survey
    subcategory_hint: review

# ── Relevance signals for repo fetchers ──────────────────────────────────────
# Extra keyword tokens shared by ALL repo fetchers to filter out irrelevant repos.
# Auto-extracted from: topic.name, topic.description, taxonomy IDs.
repo_signals:
  - "robot"
  - "robotics"
  - "manipulation"
  - "grasping"
  - "locomotion"
  - "planning"
  - "control"
  - "reinforcement learning"
  - "imitation learning"
  - "sim-to-real"
  - "human-robot"
